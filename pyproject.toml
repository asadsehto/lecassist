[project]
name = "lecassist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asad saleem", email = "156583018+asadsehto@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
]

[project.scripts]
lecassist = "lecassist:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "src/lecassist/playground",
    "src/lecassist",
]
