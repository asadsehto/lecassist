[project]
name = "lecassist"
version = "0.1.0"
description = "LecAssist: AI agents for recording, summarising and managing university lectures"
readme = "README.md"
authors = [
    { name = "asad saleem", email = "156583018+asadsehto@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
]

[project.scripts]
lecassist = "lecassist:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
